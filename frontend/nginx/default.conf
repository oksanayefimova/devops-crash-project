server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location = / {
        return 302 /dev/;
    }

    # SPA under /dev: unknown routes fall back to index.html
    location /dev/ {
        try_files $uri $uri/ /dev/index.html;
    }

    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
