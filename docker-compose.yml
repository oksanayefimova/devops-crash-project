# Teach App: MySQL + backend (Spring Boot) + frontend (React on nginx)
# plus monitoring/logging: Prometheus, Grafana, Loki, Promtail
#
#   cp .env.example .env    # then set real passwords in .env
#   docker compose up --build
#
#   Frontend:   http://localhost:3000/dev
#   Backend:    http://localhost:8080/dev
#   Grafana:    http://localhost:3001
#   Prometheus: http://localhost:9090
#   Loki:       http://localhost:3100

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-teach_db}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 forces TCP, so the check passes only after MySQL has finished
      # its first-run init (the temporary init server listens on the socket only)
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database host is the service name "db",
      # not localhost, so the URL is built here instead of taken from .env
      DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-teach_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATASOURCE_USER: ${DATASOURCE_USER:-root}
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:?set DATASOURCE_PASSWORD in .env}
    ports:
      - "8080:8080"
    volumes:
      # Shared with Promtail so the application log files can be shipped to Loki
      - backend-logs:/app/target/logs

  frontend:
    build:
      context: ./frontend
      args:
        # The React app runs in the user's browser, so it must call the backend
        # through the host's published port, not through the service name
        REACT_APP_ROOT_SERVER: ${REACT_APP_ROOT_SERVER:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  loki:
    image: grafana/loki:2.9.8
    restart: unless-stopped
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    command:
      - -config.file=/etc/loki/loki-config.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"

  promtail:
    image: grafana/promtail:2.9.8
    restart: unless-stopped
    depends_on:
      - loki
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Same volume as backend /app/target/logs, mounted read-only
      - backend-logs:/var/log/teachua:ro
    command:
      - -config.file=/etc/promtail/promtail-config.yml

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"

volumes:
  mysql-data:
  backend-logs:
  prometheus-data:
  grafana-data:
  loki-data:
