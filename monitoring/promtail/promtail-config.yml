server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Read the Spring Boot log files from the volume shared with the backend
  # container. This works regardless of the Docker log driver in use.
  - job_name: teach-backend-files
    static_configs:
      - targets: ["localhost"]
        labels:
          job: teach-backend
          service: backend
          container: teach-backend
          __path__: /var/log/teachua/*.log
    pipeline_stages:
      - multiline:
          firstline: '^\[\w+\]'
          max_wait_time: 3s
